<!DOCTYPE html>
<html lang="{{LANG}}">
<head>

  <link rel="alternate" hreflang="es" href="https://aionstudio.tech/webs/" />
  <link rel="alternate" hreflang="fr" href="https://aionstudio.tech/fr/sites-internet/" />
  <link rel="alternate" hreflang="en" href="https://aionstudio.tech/en/websites/" />
  <link rel="alternate" hreflang="x-default" href="https://aionstudio.tech/webs/" />

  <meta property="og:title" content="{{META_TITLE}}" />
  <meta property="og:description" content="{{META_DESCRIPTION}}" />
  <meta property="og:url" content="{{CANONICAL_URL}}" />

  <meta property="og:image" content="https://aionstudio.tech/assets/img/og-image-v2.jpg" />
  <meta property="og:image:secure_url" content="https://aionstudio.tech/assets/img/og-image-v2.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Aion Studio" />
  <meta property="og:site_name" content="Aion Studio" />

  {{OG_LOCALE_ALTERNATES}}

  <link rel="stylesheet" href="/css/styles.css" />

  <style>
    /* ── WEBS — específico de página (paleta editorial) ── */
    .web-packs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }
    .web-pack {
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 26px 24px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg-elevated);
    }
    .web-pack--main { border-color: var(--accent-tint); }
    .web-pack-name {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-tint);
    }
    .web-pack-price {
      font-family: var(--serif);
      font-size: clamp(28px, 3.2vw, 38px);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--ink);
      line-height: 1.1;
    }
    .web-pack-desc { font-size: 15px; font-weight: 600; color: var(--ink); }
    .web-list {
      list-style: none;
      padding: 0;
      margin: 4px 0 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .web-list li {
      position: relative;
      padding-left: 18px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--ink-soft);
    }
    .web-list li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.75em;
      width: 8px;
      height: 1px;
      background: var(--ink-muted);
    }
    .web-note {
      margin-top: 18px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
      letter-spacing: 0.02em;
      color: var(--ink-muted);
    }

    /* Opciones — filas nombre / detalle / precio */
    .web-options { list-style: none; padding: 0; margin: 0; border-top: 1px solid var(--rule); }
    .web-options li {
      display: grid;
      grid-template-columns: 230px 1fr 120px;
      gap: 18px;
      align-items: baseline;
      padding: 16px 2px;
      border-bottom: 1px solid var(--rule);
    }
    .web-opt-name { font-size: 15px; font-weight: 600; color: var(--ink); }
    .web-opt-desc { font-size: 14px; line-height: 1.5; color: var(--ink-soft); }
    .web-opt-price { font-size: 15px; font-weight: 600; color: var(--accent-tint); white-space: nowrap; text-align: right; }

    /* Mantenimiento — 2 tarjetas */
    .web-maint { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }

    /* Proceso — lista numerada */
    .web-steps {
      list-style: none;
      counter-reset: webstep;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .web-steps li {
      counter-increment: webstep;
      position: relative;
      padding-left: 46px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--ink-soft);
    }
    .web-steps li::before {
      content: counter(webstep, decimal-leading-zero);
      position: absolute;
      left: 0;
      top: 1px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--accent-tint);
    }
    .web-steps strong { color: var(--ink); font-weight: 600; }

    /* Bloque consultas dentales */
    .web-dental {
      margin-top: 56px;
      padding: 36px 34px;
      background: var(--bg-paper);
      border-radius: var(--radius-lg);
    }
    .web-dental .eyebrow { margin-bottom: 18px; }

    .web-cta-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    @media (max-width: 860px) {
      .web-packs, .web-maint { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .web-options li { grid-template-columns: 1fr auto; gap: 4px 14px; }
      .web-opt-desc { grid-column: 1 / -1; grid-row: 2; }
      .web-dental { padding: 28px 20px; }
      .web-cta-actions .btn { white-space: normal; }
      .web-cta-actions .btn-label { white-space: normal; }
    }
  </style>
</head>

        <li><a href="{{HOME_URL}}#servicios" data-i18n="nav_services"></a></li>
        <li><a href="{{HOME_URL}}#mision" data-i18n="nav_mission"></a></li>
        <li><a href="{{BLOG_URL}}" data-i18n="nav_blog"></a></li>

  <!-- HEADER -->

      <div class="aud-header-inner">
        <div>
          <div class="aud-badge" data-i18n="web_eyebrow"></div>

            <span data-i18n="web_title_lead"></span>
            <em class="italic" data-i18n="web_title_italic"></em>
          </h1>
        </div>
        <p class="aud-subtitle" data-i18n="web_subtitle"></p>
      </div>
    </div>
  </section>

  <section class="aud-section">
    <div class="container-narrow">

      <p class="prof-lead" data-i18n="web_intro"></p>

      <!-- PACKS -->
      <div class="prof-block">
        <div class="eyebrow" data-i18n="web_packs_eyebrow"></div>
        <div class="web-packs">
          <div class="web-pack web-pack--main">
            <div class="web-pack-name" data-i18n="web_p1_name"></div>
            <div class="web-pack-price" data-i18n="web_p1_price"></div>
            <p class="web-pack-desc" data-i18n="web_p1_desc"></p>
            <ul class="web-list" data-i18n="web_p1_list"></ul>
          </div>
          <div class="web-pack">
            <div class="web-pack-name" data-i18n="web_p2_name"></div>
            <div class="web-pack-price" data-i18n="web_p2_price"></div>
            <p class="web-pack-desc" data-i18n="web_p2_desc"></p>
            <ul class="web-list" data-i18n="web_p2_list"></ul>
          </div>
          <div class="web-pack">
            <div class="web-pack-name" data-i18n="web_p3_name"></div>
            <div class="web-pack-price" data-i18n="web_p3_price"></div>
            <p class="web-pack-desc" data-i18n="web_p3_desc"></p>
            <ul class="web-list" data-i18n="web_p3_list"></ul>
          </div>
        </div>
        <p class="web-note" data-i18n="web_price_note"></p>
      </div>

      <!-- OPCIONES -->
      <div class="prof-block">
        <div class="eyebrow" data-i18n="web_opt_eyebrow"></div>
        <ul class="web-options" data-i18n="web_opt_list"></ul>
      </div>

      <!-- MANTENIMIENTO (aparte y opcional) -->
      <div class="prof-block">
        <div class="eyebrow" data-i18n="web_maint_eyebrow"></div>
        <div class="web-maint">
          <div class="web-pack">
            <div class="web-pack-name" data-i18n="web_m1_name"></div>
            <div class="web-pack-price" data-i18n="web_m1_price"></div>
            <p class="prof-feature-desc" data-i18n="web_m1_desc"></p>
          </div>
          <div class="web-pack">
            <div class="web-pack-name" data-i18n="web_m2_name"></div>
            <div class="web-pack-price" data-i18n="web_m2_price"></div>
            <p class="prof-feature-desc" data-i18n="web_m2_desc"></p>
          </div>
        </div>
        <p class="prof-diff-text" style="margin-top: 18px;" data-i18n="web_maint_note"></p>

      <!-- CÓMO TRABAJAMOS (proceso + pago) -->

        <div class="eyebrow" data-i18n="web_how_eyebrow"></div>

      <!-- CONSULTAS DENTALES -->

            <div class="faq-a"><p data-i18n="web_faq4_a"></p></div>

          <details class="faq-item">
            <summary class="faq-q"><span data-i18n="web_faq5_q"></span><svg class="faq-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
